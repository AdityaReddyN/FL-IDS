# D-039 kind (B): mixed realistic-prevalence set, all families together,
# Bernoulli mode at a small tau, one overlay per segment (lexicographic merge).
# NOT APPROVED FOR GENERATION (r values pending, D-043). band_p95_m = HDD train
# p95 (gate1b_v2), tied to the source/split fingerprint.
plan_version: 1
name: mixed_realistic_prevalence
source:
  clean_dir: data/processed/hdd_clean_v1
band_p95_m:
  "0_50": 476.7
  "50_100": 829.3
  "100_200": 1653.6
  "200_plus": 2382.6
overlays:
  - family: constant_deviation
    tier: moderate
    tier_ratio_r: 1.0
    duration_seconds: 120
    onset_mode: linear_mix
    tau: 0.005
  - family: random_gaussian_deviation
    tier: moderate
    duration_seconds: 120
    onset_mode: linear_mix
    tau: 0.005
  - family: gradual_deviation
    tier: moderate
    duration_seconds: 900          # gradual needs a long episode (>= 5 effective rows)
    onset_mode: linear_mix
    tau: 0.005
  - family: altitude_constant_deviation
    tier: moderate
    altitude_variant: baro_only
    duration_seconds: 120
    onset_mode: linear_mix
    tau: 0.005
  - family: replay_partial_field
    tier: moderate
    duration_seconds: 120
    onset_mode: linear_mix
    tau: 0.005
  - family: replay_full_field
    tier: moderate
    duration_seconds: 120
    onset_mode: linear_mix
    tau: 0.005
  - family: freeze_fixed_value
    tier: moderate
    duration_seconds: 120
    onset_mode: linear_mix
    tau: 0.005
